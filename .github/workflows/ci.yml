name: CI

on:
  pull_request:
  # main is verified after every merge as well as before it. A status check that
  # only ever runs on a pull request says nothing about the branch it protects.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      # axe drives a real browser. The runner ships Chrome but no matching
      # chromedriver, and axe exits 2 rather than skipping when it cannot find
      # one. This gate has never executed anywhere: it skips locally on Node 18
      # by a named concession, and until the link fix landed CI failed before
      # reaching it.
      - name: Install a chromedriver matching the runner's Chrome
        # It exits 1 on success and writes ~/.browser-driver-manager/.env,
        # which mk/a8.mk reads for the chromedriver path.
        run: npx --yes browser-driver-manager install chrome || true
      - name: Run build, golden, vet, links, HTML, axe, budgets and secret gates
        env:
          A8_EXTERNAL_LINKS: '1'
        run: make check A8_EXTERNAL_LINKS=1

  preview:
    needs: check
    # Cloudflare credentials are not available to pull requests from forks.
    # Same-repository pull requests receive the real versioned preview URL.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install templ
        # Wrangler is resolved by npx in mk/a8.mk, so no global install.
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Upload draft-inclusive preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make preview
