name: CI

on:
  pull_request:
  # main is verified after every merge as well as before it. A status check that
  # only ever runs on a pull request says nothing about the branch it protects.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Run build, golden, vet, links, HTML, axe, budgets and secret gates
        env:
          A8_EXTERNAL_LINKS: '1'
        run: make check A8_EXTERNAL_LINKS=1

  preview:
    needs: check
    # Cloudflare credentials are not available to pull requests from forks.
    # Same-repository pull requests receive the real versioned preview URL.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install templ and Wrangler
        run: |
          go install github.com/a-h/templ/cmd/templ@v0.3.1020
          npm install --global wrangler@4
      - name: Upload draft-inclusive preview version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: make preview
